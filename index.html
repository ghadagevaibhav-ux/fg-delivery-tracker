<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FG Delivery Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--surface:#111827;--card:#1a2236;--border:#2a3650;--accent:#00d4aa;--accent2:#4f9eff;--text:#e2e8f0;--muted:#64748b;--delivered:#00d4aa;--intransit:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:linear-gradient(135deg,#0d1b2e,#0a0e1a);border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
header h1{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rec-count{color:var(--muted);font-size:.82rem;margin-left:auto}
.container{width:100%;max-width:760px;padding:32px 20px;flex:1;display:flex;flex-direction:column}
.chat-window{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;min-height:420px;max-height:600px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;margin-bottom:16px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;gap:4px;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{align-items:flex-start}.msg.user{align-items:flex-end}
.bubble{max-width:96%;padding:12px 16px;border-radius:14px;font-size:.92rem;line-height:1.55}
.msg.bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;width:100%}
.msg.bot .bubble.short{width:auto}
.msg.user .bubble{background:linear-gradient(135deg,#1a3a5c,#0f2a45);border:1px solid #2a4a6a;border-bottom-right-radius:4px;color:#a8d4ff}
.res-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.big{font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent2)}
.summary{font-size:.84rem;color:var(--muted);margin:2px 0 6px}
.summary b{color:var(--text)}
.order-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.ship-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--border);gap:10px}
.ship-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:500}
.field-value{font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.field.full-width{grid-column:1/-1}
.status-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.82rem;font-weight:600;white-space:nowrap}
.st-delivered{background:rgba(0,212,170,.12);color:var(--delivered);border:1px solid rgba(0,212,170,.3)}
.st-intransit{background:rgba(245,158,11,.12);color:var(--intransit);border:1px solid rgba(245,158,11,.3)}
.st-billed{background:rgba(79,158,255,.12);color:var(--accent2);border:1px solid rgba(79,158,255,.3)}
.st-unknown{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.extra{display:none}
.expanded .extra{display:grid}
.more-btn{margin-top:12px;width:100%;background:transparent;border:1px dashed var(--accent2);color:var(--accent2);border-radius:10px;padding:10px;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer}
.expanded .more-btn{display:none}
.input-row{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 18px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none}
input[type=text]:focus{border-color:var(--accent2)}
input[type=text]::placeholder{color:var(--muted)}
button.send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:13px 22px;color:#0a0e1a;font-weight:700;font-size:.95rem;cursor:pointer}
.status-bar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:8px 4px;font-size:.8rem;color:var(--muted);gap:10px;flex-wrap:wrap}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing span{width:7px;height:7px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.2);border-radius:20px;padding:4px 12px;font-size:.75rem;color:var(--accent)}
@media(max-width:520px){.order-card{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">🏭</div>
  <h1>FG DELIVERY TRACKER</h1>
  <span class="rec-count" id="recCount"></span>
</header>
<div class="container">
  <div class="chat-window" id="chatWindow"></div>
  <div class="input-row">
    <input type="text" id="orderInput" placeholder="Enter Invoice No, Delivery No or Sales/PO Order No" inputmode="numeric"/>
    <button class="send-btn" onclick="handleQuery()">Search</button>
  </div>
  <div class="status-bar">
    <span id="dataStatus" class="badge">Ready</span>
    <span id="lastUpdated"></span>
  </div>
</div>
<script>
// Data files live in the same site (GitHub Pages) under /chunks/. File lengths come from meta.json
// (and must match the admin upload tool).
let lens = { i: 6, p: 4, d: 4 };
let version = '1';
const cache = {};          // downloaded files stay in memory -> repeat searches are instant
const MAX_SHOWN = 10;      // cards shown at first; the rest appear with one click

async function init() {
  try {
    const r = await fetch('meta.json?t=' + Date.now());
    if (r.ok) {
      const m = await r.json();
      if (m.lens) lens = m.lens;
      if (m.last_updated) { version = encodeURIComponent(m.last_updated); document.getElementById('lastUpdated').textContent = 'Updated: ' + m.last_updated; }
      if (m.total_records) document.getElementById('recCount').textContent = Number(m.total_records).toLocaleString() + ' invoices';
    }
  } catch (e) {}
  addMsg('bot', '👋 <strong>Welcome to the FG Delivery Tracker!</strong><br><span style="color:var(--muted)">Enter an <b style="color:var(--text)">Invoice No</b>, <b style="color:var(--text)">Delivery No</b> or <b style="color:var(--text)">Sales/PO Order No</b> to see the delivery status, LR details, transporter and delivery date.</span>', true);
}

async function loadFile(name) {
  if (cache[name]) return cache[name];
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const resp = await fetch('chunks/' + name + '.json?v=' + version, { signal: ctrl.signal });
    if (resp.status === 404) { cache[name] = {}; return cache[name]; }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    cache[name] = await resp.json();
    return cache[name];
  } finally { clearTimeout(timer); }
}

// Looks the number up as Invoice No, Delivery No and Sales/PO Order No at the same time
async function findShipments(key) {
  const [invFile, poIdx, delIdx] = await Promise.all([
    loadFile('i_' + key.substring(0, lens.i)),
    loadFile('p_' + key.substring(0, lens.p)),
    loadFile('d_' + key.substring(0, lens.d))
  ]);
  const matchedBy = [], invoices = new Set();
  if (invFile[key])  { matchedBy.push('Invoice No');        invoices.add(key); }
  if (poIdx[key])    { matchedBy.push('Sales/PO Order No'); poIdx[key].forEach(i => invoices.add(i)); }
  if (delIdx[key])   { matchedBy.push('Delivery No');       delIdx[key].forEach(i => invoices.add(i)); }
  if (!invoices.size) return { records: [], matchedBy };
  const files = {};
  for (const inv of invoices) { const n = 'i_' + inv.substring(0, lens.i); files[n] = true; }
  await Promise.all(Object.keys(files).map(loadFile));
  const records = [];
  for (const inv of invoices) { const f = cache['i_' + inv.substring(0, lens.i)]; if (f && f[inv]) records.push(f[inv]); }
  return { records, matchedBy };
}

const chatWindow = document.getElementById('chatWindow');
const input = document.getElementById('orderInput');

function esc(v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function addMsg(type, html, short) {
  const div = document.createElement('div'); div.className = 'msg ' + type;
  const b = document.createElement('div'); b.className = 'bubble' + (short ? ' short' : ''); b.innerHTML = html;
  div.appendChild(b); chatWindow.appendChild(div); chatWindow.scrollTop = chatWindow.scrollHeight;
}
function showTyping() {
  const d = document.createElement('div'); d.className = 'msg bot'; d.id = 'typing';
  d.innerHTML = '<div class="bubble short"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatWindow.appendChild(d); chatWindow.scrollTop = chatWindow.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function statusClass(s) {
  const t = String(s || '').toLowerCase();
  if (t.includes('deliver')) return 'st-delivered';
  if (t.includes('transit')) return 'st-intransit';
  if (t.includes('bill')) return 'st-billed';
  return 'st-unknown';
}
function badge(s) {
  const icon = { 'st-delivered': '✅ ', 'st-intransit': '🚚 ', 'st-billed': '🧾 ' }[statusClass(s)] || '';
  return '<span class="status-badge ' + statusClass(s) + '">' + icon + esc(s && s !== 'N/A' ? s : 'Unknown') + '</span>';
}
function statusRank(s) { const c = statusClass(s); return c === 'st-intransit' ? 0 : c === 'st-billed' ? 1 : c === 'st-delivered' ? 3 : 2; }
function ts(r) { const t = Date.parse(String(r.lr_date || '').replace(/-/g, ' ')); return isNaN(t) ? 0 : t; }
// not-yet-delivered first, then newest LR date first
function sortRecords(list) { return list.slice().sort((a, b) => statusRank(a.status) - statusRank(b.status) || ts(b) - ts(a) || String(b.invoice).localeCompare(String(a.invoice))); }

function field(label, value, extra) {
  return '<div class="field' + (extra ? ' ' + extra : '') + '"><span class="field-label">' + label + '</span><span class="field-value">' + esc(value || 'N/A') + '</span></div>';
}
function card(r, i, n) {
  let h = '<div class="order-card' + (i >= MAX_SHOWN ? ' extra' : '') + '">';
  if (n > 1) h += '<div class="ship-head"><span class="ship-title">Shipment ' + (i + 1) + ' of ' + n + '</span>' + badge(r.status) + '</div>';
  h += field('Invoice No', r.invoice) + field('Plant', r.plant);
  h += field('Sales/PO Order No', r.po) + field('Delivery No', r.delivery);
  h += field('LR Number', r.lr) + field('LR Date', r.lr_date);
  h += field('Transporter Name', r.transporter, 'full-width');
  h += field('Delivery Date', r.delivery_date);
  return h + '</div>';
}
function renderResult(key, res) {
  const list = sortRecords(res.records), n = list.length;
  const right = n === 1 ? badge(list[0].status) : '<span class="status-badge st-unknown">' + n + ' shipments</span>';
  let h = '<div class="res-head"><div><div class="lbl">' + esc(res.matchedBy.join(' / ')) + '</div><div class="big">' + esc(key) + '</div></div>' + right + '</div>';
  if (n > 1) {
    const c = { delivered: 0, transit: 0, billed: 0, other: 0 };
    list.forEach(r => { const s = statusClass(r.status); if (s === 'st-delivered') c.delivered++; else if (s === 'st-intransit') c.transit++; else if (s === 'st-billed') c.billed++; else c.other++; });
    const parts = [];
    if (c.transit) parts.push('<b>' + c.transit + '</b> in transit');
    if (c.billed) parts.push('<b>' + c.billed + '</b> billed');
    if (c.delivered) parts.push('<b>' + c.delivered + '</b> delivered');
    if (c.other) parts.push('<b>' + c.other + '</b> other');
    h += '<div class="summary">' + parts.join(' · ') + ' &nbsp;(not-yet-delivered shipments are listed first)</div>';
  }
  list.forEach((r, i) => { h += card(r, i, n); });
  if (n > MAX_SHOWN) h += '<button class="more-btn" onclick="this.parentElement.classList.add(\'expanded\')">Show all ' + n + ' shipments</button>';
  return '<div>' + h + '</div>';
}

async function handleQuery() {
  const raw = input.value.trim();
  if (!raw) return;
  const key = raw.replace(/[\s,]/g, '').replace(/\.0$/, '');
  addMsg('user', '🔍 ' + esc(raw), true);
  input.value = '';
  if (!key) return;
  showTyping();
  const status = document.getElementById('dataStatus');
  status.textContent = '⏳ Searching...';
  const t0 = performance.now();
  try {
    const res = await findShipments(key);
    removeTyping();
    if (res.records.length) addMsg('bot', renderResult(key, res));
    else addMsg('bot', '<strong>Not found</strong><br><span style="color:var(--muted);font-size:.88rem;">No record for <b style="color:var(--accent2)">' + esc(key) + '</b>. Please check the number (Invoice No, Delivery No or Sales/PO Order No).</span>', true);
    status.textContent = '✅ Done in ' + ((performance.now() - t0) / 1000).toFixed(1) + 's';
  } catch (err) {
    removeTyping();
    const why = err.name === 'AbortError' ? 'Download timed out after 30 seconds' : err.message;
    addMsg('bot', '⚠️ <strong>Search failed</strong><br><span style="color:var(--muted);font-size:.88rem;">' + esc(why) + '. Please try again.</span>', true);
    status.textContent = '❌ ' + why;
  }
}
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleQuery(); });
init();
</script>
</body>
</html>
